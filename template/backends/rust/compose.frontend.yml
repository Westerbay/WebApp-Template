services:
  mailpit:
    ports:
      - "127.0.0.1::8025"
  api:
    build: .
    image: webapp-template-rust-auth-prototype:local
    working_dir: /work
    environment:
      CARGO_HOME: /cache
      RUST_AUTH_TEST_WEB_ORIGIN: "http://127.0.0.1:${RUST_AUTH_TEST_WEB_PORT}"
      RUST_AUTH_TEST_API_ORIGIN: "http://127.0.0.1:${RUST_AUTH_TEST_API_PORT}"
      RUST_AUTH_TEST_BASE_LOCALE: "${RUST_AUTH_TEST_BASE_LOCALE:-en}"
    ports:
      - "127.0.0.1:${RUST_AUTH_TEST_API_PORT}:4100"
    volumes:
      - .:/work
      - /tmp/skull-rust-target:/work/target
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["/work/target/debug/webapp-api", "--test-server"]
