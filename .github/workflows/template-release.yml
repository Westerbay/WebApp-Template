name: Template release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Do not cancel a publication already in progress for this tag.
concurrency:
  group: template-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/template-validation.yml

  publish-release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: webapp-template-*.zip
          path: release
          merge-multiple: true
          skip-decompress: true
      - name: Publish the six validated templates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release/webapp-template-*.zip)
          if [ "${#assets[@]}" -ne 6 ]; then
            echo "::error::Expected six template ZIPs in release/, found ${#assets[@]}"
            find release -maxdepth 2 -type f
            exit 1
          fi
          for asset in "${assets[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "::error::Template ZIP is empty: $asset"
              exit 1
            fi
            python3 -c 'import sys, zipfile; assert zipfile.ZipFile(sys.argv[1]).testzip() is None' "$asset"
          done
          node scripts/template-release.mjs "${assets[@]}"
