name: Application checks
on:
  workflow_call:
permissions:
  contents: read
env:
  CI: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - name: CI planning and security discovery tests
        run: python3 -m unittest discover -s scripts/test -p 'ci_*_test.py' -v
      - name: Read application locales
        id: locales
        run: echo "locales=$(node -p 'JSON.parse(require("fs").readFileSync("packages/i18n/project.inlang/settings.json", "utf8")).locales.join(",")')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/validate-project
        with:
          locales: ${{ steps.locales.outputs.locales }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-diagnostics
          path: output/
          retention-days: 7
          if-no-files-found: ignore
