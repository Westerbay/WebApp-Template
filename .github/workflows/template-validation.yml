name: Validate template archives

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true

jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - run: pnpm install --frozen-lockfile
      - run: pnpm template:check
      - run: node scripts/template-rust/check-assets.mjs
      - id: profiles
        run: echo "matrix=$(node scripts/template-profiles.mjs)" >> "$GITHUB_OUTPUT"

  language-profile:
    needs: profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    env:
      PROFILE_ID: ${{ matrix.id }}
      BACKEND: ${{ matrix.backend }}
      ARTIFACT_ID: ${{ matrix.artifact }}
      PROFILE_LOCALES: ${{ matrix.locales }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - name: Install template tooling
        run: pnpm install --frozen-lockfile
      - name: Generate source ZIP
        run: node scripts/template-archives.mjs --profile "$PROFILE_ID" --backend "$BACKEND" --output output/templates
      - name: Extract the ZIP for validation
        run: python3 -m zipfile --extract "output/templates/webapp-template-$ARTIFACT_ID.zip" "output/validate-$ARTIFACT_ID"
      - name: Validate the extracted project
        uses: ./.github/actions/validate-project
        with:
          directory: output/validate-${{ matrix.artifact }}
          locales: ${{ matrix.locales }}
          infrastructure: "false"

      - name: Upload failed profile diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-${{ matrix.artifact }}-e2e-diagnostics
          path: output/validate-${{ matrix.artifact }}/output/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload source ZIP without an outer archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: output/templates/webapp-template-${{ matrix.artifact }}.zip
          archive: false
          if-no-files-found: error
