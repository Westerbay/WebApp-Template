name: Grafana image

on:
  pull_request:
    paths:
      - "infra/images/grafana/**"
      - "infra/compose/observability.yml"
      - ".github/workflows/grafana-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the pinned Grafana image
        run: docker build --progress plain --platform linux/amd64 -t grafana-security:test infra/images/grafana
      - name: Verify the server matches the pinned upstream release
        shell: bash
        run: |
          docker run --rm --network none --entrypoint /usr/share/grafana/bin/grafana grafana-security:test --version | tee /tmp/grafana-version.txt
          expected_version=$(sed -n 's/^FROM grafana\/grafana:\([^@ ]*\).*/\1/p' infra/images/grafana/Dockerfile)
          test -n "$expected_version"
          grep -Fx "grafana version $expected_version" /tmp/grafana-version.txt
