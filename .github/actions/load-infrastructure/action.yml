name: Load scanned infrastructure
description: Reuse the exact infrastructure images built and scanned in this run.
inputs:
  pattern:
    description: Infrastructure image artifacts to load
    default: infra-image-*
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ runner.temp }}/infrastructure-images
        merge-multiple: true
    - name: Load scanned Docker images
      shell: bash
      run: |
        shopt -s nullglob
        images=("$RUNNER_TEMP"/infrastructure-images/*.tar)
        if [ "${#images[@]}" -eq 0 ]; then
          echo '::error::No scanned infrastructure image artifacts found'
          exit 1
        fi
        for image in "${images[@]}"; do
          docker load --input "$image"
        done
