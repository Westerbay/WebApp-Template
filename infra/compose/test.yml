services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: webapp_template_auth_test
      POSTGRES_USER: webapp_template_auth_test
      POSTGRES_PASSWORD: isolated-fixture-only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U webapp_template_auth_test -d webapp_template_auth_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1::1025"
      - "127.0.0.1::8025"
