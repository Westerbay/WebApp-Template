name: webapp-template-valkey

services:
  valkey:
    image: valkey/valkey:8.1.10-alpine3.24
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
