name: webapp-template-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/config.yml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../observability/blackbox.yml:/etc/blackbox/config.yml:ro

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ../observability/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.21.1
    restart: unless-stopped
    command:
      - run
      - --disable-reporting
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Local example defaults match .env.example; override for other targets.
      OBS_POSTGRES_DSN: "${OBS_POSTGRES_DSN:-postgresql://webapp_template:webapp_template_dev@host.docker.internal:5433/webapp_template?sslmode=disable&connect_timeout=2&statement_timeout=1500&default_transaction_read_only=on}"
      OBS_VALKEY_URL: "${OBS_VALKEY_URL:-redis://host.docker.internal:6379}"
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ../observability/config.alloy:/etc/alloy/config.alloy:ro
      - ../observability/postgres.yml:/etc/alloy/postgres.yml:ro
      - ../observability/postgres-statements.yml:/etc/alloy/postgres-statements.yml:ro
      - ../../output/logs:/var/log/webapp-template:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ../observability/grafana:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

volumes:
  loki_data:
  alloy_data:
  grafana_data:
  prometheus_data:
