packages:
  - apps/*
  - packages/*

overrides:
  "minimatch@>=9 <11": "11.0.4"
  "eslint-plugin-import-x>minimatch": "10.2.6"
  # Nest 11 pins multer before its pending fileFilter teardown fix (GHSA-q7qp-rjg7-q26m).
  "@nestjs/platform-express>multer": "2.5.0"
  # Swagger 11 pins a vulnerable js-yaml release (GHSA-r3ph-w7gj-g6xm).
  "@nestjs/swagger>js-yaml": "5.4.1"
  # Drizzle's legacy TypeScript loader pins esbuild <0.25 (GHSA-67mh-4wv8-2f99).
  "@esbuild-kit/core-utils>esbuild": "0.25.12"

allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

patchedDependencies:
  minimatch@10.2.6: patches/minimatch@10.2.6.patch
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch

minimumReleaseAgeExclude:
  - minimatch@11.0.4
